# Marlow Freight — navy/amber, dense, utilitarian ("terminal, not brochure")
colors:
  background: "#f7f9fb"
  foreground: "#101a2e"
  surface: "#ffffff"
  primary: "#1b2a4a" # navy, brand PDF
  primary-foreground: "#ffffff"
  muted: "#eaeef4"
  muted-foreground: "#5b6b82"
  accent: "#fde9c4" # amber wash
  accent-foreground: "#8a5a00"
  border: "#d7dee8"
  ring: "#e8a313" # amber focus
  destructive: "#b42318"
  destructive-foreground: "#ffffff"
type:
  sans: system-ui, -apple-system, sans-serif
  mono: ui-monospace, SFMono-Regular, Menlo, monospace
  numbers: tabular # money, consignment IDs, ETAs — everything aligns
  scale:
    xs: { size: 0.6875rem, lineHeight: 0.875rem }
    sm: { size: 0.8125rem, lineHeight: 1.125rem }
    base: { size: 0.9375rem, lineHeight: 1.375rem }
    lg: { size: 1.0625rem, lineHeight: 1.5rem }
    xl: { size: 1.1875rem, lineHeight: 1.625rem }
    "2xl": { size: 1.375rem, lineHeight: 1.75rem }
    "3xl": { size: 1.75rem, lineHeight: 2rem }
density: compact
radii:
  sm: 0.125rem
  md: 0.25rem
  lg: 0.375rem
shadows:
  sm: 0 1px 1px 0 rgb(16 26 46 / 0.06)
  md: 0 2px 4px -1px rgb(16 26 46 / 0.08)
  lg: 0 6px 12px -2px rgb(16 26 46 / 0.1)
