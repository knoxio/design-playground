# Softer comparison direction — same navy family, more air, friendlier corners.
colors:
  background: "#fbfcfe"
  foreground: "#1e293b"
  surface: "#ffffff"
  primary: "#2d4370" # lighter navy
  primary-foreground: "#ffffff"
  muted: "#f1f5f9"
  muted-foreground: "#64748b"
  accent: "#fef3df"
  accent-foreground: "#92610a"
  border: "#e2e8f0"
  ring: "#2d4370"
  destructive: "#dc2626"
  destructive-foreground: "#ffffff"
type:
  sans: system-ui, -apple-system, sans-serif
  mono: ui-monospace, SFMono-Regular, Menlo, monospace
  numbers: tabular
  scale:
    xs: { size: 0.75rem, lineHeight: 1rem }
    sm: { size: 0.875rem, lineHeight: 1.25rem }
    base: { size: 1rem, lineHeight: 1.5rem }
    lg: { size: 1.125rem, lineHeight: 1.75rem }
    xl: { size: 1.25rem, lineHeight: 1.75rem }
    "2xl": { size: 1.5rem, lineHeight: 2rem }
    "3xl": { size: 1.875rem, lineHeight: 2.25rem }
density: regular
radii:
  sm: 0.25rem
  md: 0.5rem
  lg: 0.75rem
shadows:
  sm: 0 1px 2px 0 rgb(30 41 59 / 0.05)
  md: 0 4px 6px -1px rgb(30 41 59 / 0.08)
  lg: 0 10px 15px -3px rgb(30 41 59 / 0.1)
