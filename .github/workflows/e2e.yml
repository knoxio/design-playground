name: E2E

# Browser smoke runs only when app/kit code (or the suite itself) changes.
# Client-only PRs stay fast and browser-free — page rendering is already
# covered by the render-smoke unit test in the always-run `checks` gate.
on:
  pull_request:
    paths:
      - "app/**"
      - "packages/**"
      - "e2e/**"
      - "playwright.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/e2e.yml"

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @design/app exec playwright install --with-deps chromium
      - run: pnpm test:e2e
