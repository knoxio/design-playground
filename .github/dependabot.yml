version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Propose only versions old enough to pass pnpm's minimum-release-age
    # supply-chain gate — otherwise every fresh release arrives as a red PR.
    cooldown:
      default-days: 3
    groups:
      all-npm:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
